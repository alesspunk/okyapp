<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDP Page 1 - OKY</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,700&family=Inter:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="/public/fontawesome-kit/css/custom-icons.min.css" />
    <link rel="stylesheet" href="./stories/mars.css" />
    <link rel="stylesheet" href="/public/pdp-pages.css" />
  </head>
  <body>
    <main class="pdp-page-shell has-plateu" aria-labelledby="pdp-page-1-title">
      <section class="pdp-page-section">
        <header class="pdp-page-top" aria-label="Encabezado del producto">
          <h1 id="pdp-page-1-title" class="sr-only">Tigo, paquete de Internet</h1>
          <div class="status-bar">
            <div>9:41</div>
            <div class="pdp-page-status-icons">
              <i class="fa-regular fa-signal" aria-hidden="true"></i>
              <i class="fa-regular fa-wifi" aria-hidden="true"></i>
              <i class="fa-regular fa-battery-full" aria-hidden="true"></i>
            </div>
          </div>

          <div class="page-header-screen pdp-page-header">
            <div class="header-icon header-icon-light"><i class="fa-light fa-arrow-left icon-medium" aria-hidden="true"></i></div>
            <div class="page-header-title page-header-title-empty" aria-hidden="true"></div>
            <div class="header-icon header-icon-bitmap header-icon-bitmap-cart" aria-hidden="true">
              <img class="header-icon-bitmap-image header-icon-bitmap-cart-image" src="./images/Cart-3d-icon.png" alt="" />
            </div>
          </div>
        </header>

        <div class="pdp-page-stack">
          <div class="pdp-page-brand-slot">
            <section class="brand-item-atom is-with-label" aria-label="Marca seleccionada">
              <p class="brand-item-label token-product-text">Tigo</p>
              <div class="brand-item-frame">
                <div class="brand-item-base">
                  <img src="./images/tigo.webp" alt="Tigo" />
                </div>
              </div>
            </section>
          </div>

          <div class="pdp-page-plateu-slot">
            <section class="plateu-molecule is-static is-default pdp-page-plateu" aria-label="Categorías telco" data-pen-id="6985:152223">
              <div class="plateu-track is-static">
                <div class="plateu-item">
                  <div class="plateu-icon-wrap"><img class="plateu-icon" src="./images/plateu8.png" alt="PAQUETES" /></div>
                  <span class="plateu-label">Paquetes</span>
                </div>
                <div class="plateu-item">
                  <div class="plateu-icon-wrap"><img class="plateu-icon" src="./images/plateu9.png" alt="INTERNET" /></div>
                  <span class="plateu-chip">Internet</span>
                </div>
                <div class="plateu-item">
                  <div class="plateu-icon-wrap"><img class="plateu-icon" src="./images/plateu10.png" alt="RECARGAS" /></div>
                  <span class="plateu-label">Recargas</span>
                </div>
                <div class="plateu-item">
                  <div class="plateu-icon-wrap"><img class="plateu-icon" src="./images/plateu11.png" alt="ANTENITA" /></div>
                  <span class="plateu-label">Antenita</span>
                </div>
              </div>
            </section>
          </div>

          <div class="pdp-page-card-slot">
            <section class="middle-card-shell is-pdp" aria-label="Detalle principal del producto" data-pen-id="6991:146235">
              <article class="middle-card-molecule is-amount">
                <div class="middle-card-content">
                  <div class="middle-card-main">
                    <p class="middle-card-title">Paquete de Internet</p>
                    <div class="middle-card-center">
                      <div class="middle-card-value">
                        <span class="middle-card-currency">$</span>
                        <p class="middle-card-amount">50</p>
                      </div>
                    </div>
                  </div>
                  <div class="middle-card-footer">
                    <span class="middle-card-footer-start">¿Qué incluye?</span>
                    <span class="middle-card-footer-end">Términos y condiciones</span>
                  </div>
                </div>
              </article>
            </section>
          </div>

          <div class="pdp-page-slider-slot">
            <section class="slider-atom" aria-label="Selector de monto">
              <div class="slider-track-shell">
                <div class="slider-track"></div>
                <div class="slider-ticks" aria-hidden="true">
                  <span class="slider-tick" style="left:16.67%"></span>
                  <span class="slider-tick" style="left:33.33%"></span>
                  <span class="slider-tick" style="left:50%"></span>
                  <span class="slider-tick" style="left:66.67%"></span>
                  <span class="slider-tick" style="left:83.33%"></span>
                </div>
                <div class="slider-fill" aria-hidden="true"></div>
                <div class="slider-thumb-halo" aria-hidden="true"></div>
                <div class="slider-thumb" aria-hidden="true">
                  <span class="slider-thumb-bubble"></span>
                </div>
                <input
                  class="slider-range"
                  type="range"
                  min="5"
                  max="100"
                  step="5"
                  value="50"
                  data-currency-symbol="$"
                  aria-label="Slider en dólares"
                />
              </div>
              <div class="slider-values token-body1">
                <span>$ 5</span>
                <span>$ 100</span>
              </div>
              <div class="slider-labels token-caption">
                <span>Mínimo</span>
                <span>Máximo</span>
              </div>
            </section>
          </div>
        </div>
      </section>

      <section class="pdp-page-summary-wrap" aria-label="Resumen de compra">
        <div class="summary-box with-overlap summary-box-compact" data-flow="products" data-step="pdp">
          <div class="summary-type-overlay">
            <span class="token-exchange">TIPO DE CAMBIO: Q 7.55</span>
          </div>
          <div class="summary-card">
            <div class="summary-card-body">
              <div class="summary-row">
                <span class="summary-label-strong">Producto</span>
                <span class="summary-label-strong">$50.00</span>
              </div>
              <div class="summary-row">
                <span class="summary-label">Costo por servicio</span>
                <span class="summary-label">$3.50</span>
              </div>
              <div class="summary-row summary-row-total pdp-page-summary-total">
                <span class="summary-label-strong">PAGAS</span>
                <span class="summary-label-strong">$53.50</span>
              </div>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-cta-row">
              <button class="btn btn-primary summary-btn"><i class="fa-regular fa-plus"></i>Agregar</button>
            </div>
          </div>
        </div>
      </section>
      <div class="pdp-page-footer-spacer"></div>
    </main>

    <nav class="pdp-page-nav" aria-label="Navegación principal">
      <div class="bottom-nav is-no-label">
        <div class="nav-item"><i class="fa-light fa-home icon-medium" aria-hidden="true"></i></div>
        <div class="nav-item"><i class="fa-light fa-map icon-medium" aria-hidden="true"></i></div>
        <div class="nav-item active"><i class="fa-solid fa-fire icon-medium" aria-hidden="true"></i></div>
        <div class="nav-item"><i class="fa-light fa-messages icon-medium" aria-hidden="true"></i></div>
        <div class="nav-item"><i class="fa-light fa-bars icon-medium" aria-hidden="true"></i></div>
      </div>
    </nav>

    <script>
      (function () {
        var THUMB_RADIUS = 14.5;
        var EDGE_INSET_EXTRA = 6;

        // Sincroniza fill/thumb/halo/burbuja con el input nativo, y además
        // refleja el valor actual en el monto de la Middle Card de arriba.
        function positionSlider(root) {
          var input = root.querySelector(".slider-range");
          var fill = root.querySelector(".slider-fill");
          var halo = root.querySelector(".slider-thumb-halo");
          var thumb = root.querySelector(".slider-thumb");
          var bubble = root.querySelector(".slider-thumb-bubble");
          var trackShell = root.querySelector(".slider-track-shell");
          if (!input || !fill || !halo || !thumb || !trackShell) {
            return;
          }

          var min = Number(input.min);
          var max = Number(input.max);
          var value = Number(input.value);
          var percent = max === min ? 0 : (value - min) / (max - min);

          var trackWidth = trackShell.clientWidth;
          if (trackWidth === 0) {
            return;
          }

          var inset = THUMB_RADIUS + EDGE_INSET_EXTRA;
          var usableWidth = Math.max(trackWidth - inset * 2, 0);
          var centerPx = inset + usableWidth * percent;
          var centerPercent = (centerPx / trackWidth) * 100;

          fill.style.width = centerPx + "px";
          thumb.style.left = centerPercent + "%";
          halo.style.left = centerPercent + "%";

          var currencySymbol = input.dataset.currencySymbol || "";
          if (bubble) {
            bubble.textContent = currencySymbol + value;
          }

          var amountEl = document.querySelector(".middle-card-amount");
          if (amountEl) {
            amountEl.textContent = value;
          }
        }

        function initSliderAtom(root, attempt) {
          attempt = attempt || 0;
          var trackShell = root.querySelector(".slider-track-shell");
          var input = root.querySelector(".slider-range");
          if (!trackShell || !input) {
            return;
          }

          if (trackShell.clientWidth === 0) {
            if (attempt < 20) {
              requestAnimationFrame(function () {
                initSliderAtom(root, attempt + 1);
              });
            }
            return;
          }

          function setActive(active) {
            root.classList.toggle("is-active", active);
          }

          input.addEventListener("pointerdown", function () {
            setActive(true);
          });
          input.addEventListener(
            "touchstart",
            function () {
              setActive(true);
            },
            { passive: true }
          );
          input.addEventListener("focus", function () {
            setActive(true);
          });
          input.addEventListener("pointerup", function () {
            setActive(false);
          });
          input.addEventListener("pointercancel", function () {
            setActive(false);
          });
          input.addEventListener("touchend", function () {
            setActive(false);
          });
          input.addEventListener("touchcancel", function () {
            setActive(false);
          });
          input.addEventListener("blur", function () {
            setActive(false);
          });
          input.addEventListener("input", function () {
            positionSlider(root);
          });

          window.addEventListener("resize", function () {
            positionSlider(root);
          });

          positionSlider(root);
        }

        var sliders = document.querySelectorAll(".slider-atom");
        for (var i = 0; i < sliders.length; i++) {
          initSliderAtom(sliders[i]);
        }
      })();
    </script>
  </body>
</html>
